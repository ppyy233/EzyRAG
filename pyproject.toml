[project]
name = "ezy-rag"
version = "0.0.17"
description = "Ezy-RAG 知识库系统"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "chromadb>=1.5.9",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "mcp>=1.27.1",
    "openai>=2.36.0",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "requests>=2.28.0",
    "sentence-transformers>=5.5.0",
    "tokenizers==0.22.1",
    "torch>=2.5.0,<2.7.0",
    "uvicorn>=0.46.0",
]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"
name = "pytorch-cu124"

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
