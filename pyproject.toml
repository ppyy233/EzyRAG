[project]
name = "qwen-embedding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "mcp>=1.27.1",
    "openai>=2.36.0",
    "opentelemetry-instrumentation-fastapi>=0.63b1",
    "pypdf>=6.11.0",
    "python-docx>=1.2.0",
    "sentence-transformers>=5.5.0",
    "tokenizers==0.22.1",
    "torch>=2.5.0,<2.6.0",
    "uvicorn>=0.46.0",
]

[tool.uv]
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
